# PATH-BASED routing: one hostname, different URL paths → different backends.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: path-routing
  namespace: default
  # figure out how to strip away "/result" from the path before forwarding to the backend.
  annotations:
    # Strip the path prefix before forwarding to the backend.
    # Without this, /blue is forwarded as-is but nginx only serves /.
    # nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: a5f2d13cb76454f058e41418a3f0c8e4-cdbb764a421e8d4a.elb.us-east-1.amazonaws.com 
      http: 
        paths:
          - path: /vote
            pathType: Prefix
            backend:
              service:
                name: vote-service
                port:
                  number: 80
          - path: /result
            pathType: Prefix
            backend:
              service:
                name: result-service
                port:
                  number: 80