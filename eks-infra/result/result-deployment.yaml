apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
        - name: result-container
          image: neonluft/result-app.amd64:latest
          ports:
            - containerPort: 80
          env:
            - name: PG_HOST
              valueFrom:
                configMapKeyRef:
                  name: result-config
                  key: PG_HOST
            - name: PG_PORT
              valueFrom:
                configMapKeyRef:
                  name: result-config
                  key: PG_PORT
            - name: PG_USER
              valueFrom:
                configMapKeyRef:
                  name: result-config
                  key: PG_USER
            - name: PG_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: result-config
                  key: PG_DATABASE
            - name: PG_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: result-config
                  key: PG_PASSWORD