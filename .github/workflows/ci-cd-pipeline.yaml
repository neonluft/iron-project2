name: Deploy to EKS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for OIDC: lets the job request a GitHub identity token
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Who am I?
        run: aws sts get-caller-identity

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t neonluft/result-app.amd64:latest ./docker_images/result
          docker push neonluft/result-app.amd64:latest 
          
          docker build -t neonluft/vote-app.amd64:latest ./docker_images/vote
          docker push neonluft/vote-app.amd64:latest

          docker build -t neonluft/worker-app.amd64:latest ./docker_images/worker
          docker push neonluft/worker-app.amd64:latest
        
      - name: Apply manifests
        run: kubectl apply -f eks-infra/postgres/ 
             kubectl apply -f eks-infra/result/ 
             kubectl apply -f eks-infra/vote/ 
             kubectl apply -f eks-infra/worker/ 
             kubectl apply -f eks-infra/redis/ 
             kubectl apply -f eks-infra/ingress.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/hello -n  --timeout=120s